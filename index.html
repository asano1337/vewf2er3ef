<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>GymFlow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300E5FF'/%3E%3Cstop offset='1' stop-color='%23FF6B35'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%230A0B0F'/%3E%3Cpath d='M20 5 10 17h6l-2 10 10-13h-6z' fill='url(%23g)'/%3E%3C/svg%3E">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0B0F; --bg-elevated:#12141A; --surface:rgba(255,255,255,.035); --surface-hover:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.14);
  --text:#F5F5F7; --text-secondary:#8B8D98; --text-tertiary:#5A5C66;
  --accent:#00E5FF; --accent-glow:rgba(0,229,255,.4); --accent-secondary:#FF6B35;
  --success:#4ADE80; --danger:#F87171; --gold:#FFD166;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; background:var(--bg); overscroll-behavior:none;}
body{font-family:'Manrope',sans-serif; color:var(--text); font-weight:500; -webkit-font-smoothing:antialiased;}
#app{position:relative; max-width:460px; margin:0 auto; height:100vh; overflow:hidden; display:flex; flex-direction:column;}
.orb{position:fixed; width:400px; height:400px; border-radius:50%; filter:blur(90px); opacity:.08; pointer-events:none; z-index:0; animation:float 20s ease-in-out infinite;}
.orb-cyan{background:var(--accent); top:-120px; right:-120px;}
.orb-orange{background:var(--accent-secondary); bottom:-120px; left:-140px; animation-delay:-10s;}
@keyframes float{0%,100%{transform:translate(0,0);}50%{transform:translate(-20px,25px);}}
.screen{position:relative; z-index:1; flex:1; overflow-y:auto; scrollbar-width:none; padding:20px 16px 110px;}
.screen::-webkit-scrollbar{display:none;}
.hidden{display:none !important;}
button{font-family:inherit; border:none; background:none; color:inherit; cursor:pointer;}
button:active, .tappable:active{transform:scale(.97); transition:transform .15s;}
input,textarea{font-family:inherit; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; font-size:16px; width:100%; outline:none;}
input:focus,textarea:focus{border-color:var(--accent);}
textarea{resize:none; font-size:14px;}
.icon{width:20px; height:20px; stroke:currentColor; stroke-width:1.8; fill:none; flex-shrink:0;}
.ellipsis{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.clamp2{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}

.card{background:var(--surface); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%); border:1px solid var(--border); border-radius:20px; padding:20px; margin-bottom:12px; opacity:0; animation:fadeInUp .5s cubic-bezier(.4,0,.2,1) forwards;}
@keyframes fadeInUp{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 var(--accent-glow);}50%{box-shadow:0 0 22px var(--accent-glow);}}
.pulse{animation:pulse 1s ease 2;}
.h1{font-size:26px; font-weight:800; letter-spacing:-0.6px;}
.h2{font-size:16px; font-weight:700; letter-spacing:-0.3px; margin-bottom:14px;}
.label{font-size:11px; font-weight:700; letter-spacing:1px; color:var(--text-secondary); text-transform:uppercase;}
.stat-num{font-size:24px; font-weight:800; letter-spacing:-1px; font-variant-numeric:tabular-nums;}
.sub{color:var(--text-secondary); font-size:14px; margin-top:4px;}

.header{display:flex; align-items:center; gap:12px; margin-bottom:20px; opacity:0; animation:fadeInUp .5s cubic-bezier(.4,0,.2,1) forwards;}
.logo-mark{width:38px; height:38px; border-radius:11px; background:var(--surface-hover); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.avatar{width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent-secondary)); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; color:#0A0B0F; flex-shrink:0; margin-left:auto;}

.hero{position:relative; overflow:hidden; background:linear-gradient(135deg, rgba(0,229,255,.08), rgba(255,107,53,.04));}
.hero::before{content:''; position:absolute; top:-60px; right:-60px; width:160px; height:160px; border-radius:50%; background:var(--accent); filter:blur(50px); opacity:.25;}
.hero-title{font-size:24px; font-weight:800; margin:6px 0 16px; position:relative;}
.btn-primary{background:var(--accent); color:#0A0B0F; font-weight:700; font-size:14px; padding:14px 22px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 0 24px var(--accent-glow); position:relative;}
.btn-primary:disabled{opacity:.4; box-shadow:none;}
.btn-secondary{background:var(--surface); border:1px solid var(--border-strong); color:var(--text); font-weight:700; font-size:14px; padding:14px 22px; border-radius:999px; display:inline-flex; align-items:center; gap:8px; justify-content:center;}
.btn-secondary:disabled{opacity:.35;}
.btn-ghost{background:none; color:var(--accent); font-weight:700; font-size:13px;}
.btn-row{display:flex; gap:10px;}
.btn-row>*{flex:1;}

.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.stat-card{position:relative;}
.stat-icon{position:absolute; top:16px; right:16px; opacity:.35; width:18px; height:18px;}

.ring-row{display:flex; align-items:center; gap:16px;}

.ex-row{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border);}
.ex-row:last-child{border-bottom:none;}
.ex-icon{width:40px; height:40px; border-radius:12px; background:var(--surface-hover); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--accent);}
.ex-icon svg{width:20px; height:20px;}
.ex-icon.big-ex{width:100px; height:100px; border-radius:24px;}
.ex-icon.big-ex svg{width:52px; height:52px;}
.ex-name{font-weight:600; font-size:14px;}
.ex-muscle{font-size:12px; color:var(--text-tertiary);}
.dots{display:flex; gap:4px; margin-left:auto;}
.dot{width:7px; height:7px; border-radius:50%; background:var(--border-strong);}
.dot.done{background:var(--accent);}

.dock{position:fixed; bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:4px; background:rgba(18,20,26,.85); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid var(--border); border-radius:999px; padding:6px; z-index:20; padding-bottom:calc(6px + env(safe-area-inset-bottom));}
.dock-btn{display:flex; align-items:center; justify-content:center; gap:6px; padding:11px 14px; border-radius:999px; color:var(--text-secondary); font-size:12px; font-weight:700;}
.dock-btn.active{background:var(--accent); color:#0A0B0F; box-shadow:0 0 20px var(--accent-glow);}
.dock svg{width:17px; height:17px; stroke:currentColor; stroke-width:1.8; fill:none;}

.ob-wrap{padding:24px 20px; height:100%; display:flex; flex-direction:column; position:relative; z-index:1;}
.ob-opt{display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px; margin-bottom:10px;}
.ob-opt.sel{border-color:var(--accent); background:rgba(0,229,255,.08);}
.ob-opt-title{font-weight:700; font-size:15px;}
.ob-opt-sub{font-size:12px; color:var(--text-secondary); margin-top:2px;}
.ob-check{width:22px; height:22px; border-radius:50%; border:2px solid var(--border-strong); flex-shrink:0;}
.ob-opt.sel .ob-check{border-color:var(--accent); background:var(--accent); position:relative;}
.ob-opt.sel .ob-check::after{content:''; position:absolute; left:6px; top:2px; width:5px; height:9px; border:solid #0A0B0F; border-width:0 2px 2px 0; transform:rotate(45deg);}
.ob-dots{display:flex; gap:6px; justify-content:center; margin:20px 0;}
.ob-dot{width:8px; height:8px; border-radius:999px; background:var(--border-strong); transition:all .3s;}
.ob-dot.active{width:24px; background:var(--accent);}

.overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50; opacity:0; pointer-events:none; transition:opacity .3s;}
.overlay.show{opacity:1; pointer-events:auto;}
.sheet{position:fixed; left:0; right:0; bottom:0; max-width:460px; margin:0 auto; max-height:88vh; overflow-y:auto; scrollbar-width:none; background:var(--bg-elevated); border-radius:24px 24px 0 0; padding:24px 20px calc(24px + env(safe-area-inset-bottom)); z-index:51; transform:translateY(100%); transition:transform .4s cubic-bezier(.32,.72,0,1); border-top:1px solid var(--border-strong);}
.sheet.show{transform:translateY(0);}
.sheet-handle{width:36px; height:4px; background:var(--border-strong); border-radius:999px; margin:0 auto 18px;}
.sheet-close{position:absolute; top:16px; right:16px; width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.06); border:1px solid var(--border); color:var(--text); font-size:16px; font-weight:700; display:flex; align-items:center; justify-content:center; z-index:52;}
.sheet .h1{padding-right:44px;}
.field-row{display:flex; gap:10px; margin:16px 0;}
.field{flex:1;}
.field label{font-size:12px; color:var(--text-secondary); margin-bottom:6px; display:block;}
.sheet-actions{display:flex; gap:10px; margin-top:8px;}
.sheet-actions button{flex:1; text-align:center; justify-content:center;}

.pr-row{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border);}
.pr-row:last-child{border-bottom:none;}
.pr-medal{font-size:20px; width:28px; text-align:center;}

.workout-screen{position:fixed; inset:0; z-index:40; background:var(--bg); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .35s cubic-bezier(.4,0,.2,1);}
.workout-screen.show{transform:translateX(0);}
.workout-top{padding:calc(16px + env(safe-area-inset-top)) 16px 10px;}
.workout-top-row{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
.wprogress-track{width:100%; height:3px; border-radius:3px; background:var(--border); overflow:hidden;}
.wprogress-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-secondary)); border-radius:3px; transition:width .5s cubic-bezier(.4,0,.2,1);}
.wbadge{display:inline-block; font-size:11px; color:var(--accent); background:rgba(0,229,255,.1); padding:4px 10px; border-radius:999px; margin-top:8px;}
.workout-body{flex:1; overflow-y:auto; padding:16px; scrollbar-width:none;}
.workout-bottom{padding:14px 16px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--border); display:flex; gap:10px;}
.set-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.set-num{width:28px; height:28px; display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--text-secondary); font-size:13px; flex-shrink:0;}
.set-row input{padding:12px;}
.set-remove{color:var(--text-tertiary); font-size:20px; width:28px; height:28px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.hint-card{background:rgba(255,209,102,.1); border:1px solid rgba(255,209,102,.3); border-radius:14px; padding:12px 14px; font-size:13px; color:var(--gold); margin-bottom:16px;}

.rest-bar{position:fixed; top:0; left:0; right:0; max-width:460px; margin:0 auto; z-index:45; background:var(--bg-elevated); border-bottom:1px solid var(--border-strong); padding:calc(14px + env(safe-area-inset-top)) 18px 14px; transform:translateY(-100%); transition:transform .35s cubic-bezier(.32,.72,0,1);}
.rest-bar.show{transform:translateY(0);}
.rest-num{font-size:34px; font-weight:800; text-align:center; font-variant-numeric:tabular-nums; letter-spacing:-1px;}
.rest-track{width:100%; height:5px; border-radius:5px; background:var(--border); overflow:hidden; margin:10px 0 12px;}
.rest-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-secondary)); border-radius:5px; transition:width 1s linear;}
.rest-dur{display:flex; gap:6px; justify-content:center; margin-bottom:10px;}
.rest-dur-btn{padding:6px 12px; border-radius:999px; background:var(--surface); border:1px solid var(--border); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center;}
.rest-dur-btn.sel{background:var(--accent); color:#0A0B0F; border-color:var(--accent);}

.heatmap-scroll{overflow-x:auto; scrollbar-width:none; margin:6px 0;}
.heatmap-grid{display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,11px); gap:3px; width:max-content;}
.hm-cell{width:11px; height:11px; border-radius:3px; background:var(--border);}
.legend{display:flex; align-items:center; gap:5px; margin-top:10px; font-size:11px; color:var(--text-tertiary);}
.legend .hm-cell{width:9px; height:9px;}
#hmTooltip{font-size:13px; color:var(--text); margin-top:8px; min-height:18px;}

.spark{display:block; margin-top:4px;}
.picker-item{display:flex; align-items:center; gap:10px; padding:12px; border-radius:12px; margin-bottom:6px; background:var(--surface);}
.freq-row{display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 16px;}
.freq-btn{width:36px; height:36px; border-radius:10px; background:var(--surface); border:1px solid var(--border); font-weight:700; display:flex; align-items:center; justify-content:center; font-size:14px; line-height:1;}
.freq-btn.sel{background:var(--accent); color:#0A0B0F; border-color:var(--accent);}
.day-block{border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:10px;}

.prog-cover{height:110px; border-radius:16px; margin-bottom:12px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;}
.prog-cover svg{width:56px; height:56px; opacity:.85;}

.pd-screen{position:fixed; inset:0; z-index:35; background:var(--bg); overflow-y:auto; transform:translateX(100%); transition:transform .35s cubic-bezier(.4,0,.2,1); scrollbar-width:none;}
.pd-screen.show{transform:translateX(0);}
.pd-top{padding:calc(16px + env(safe-area-inset-top)) 16px 0;}
.pd-back{display:inline-flex; align-items:center; gap:6px; color:var(--text-secondary); font-weight:700; font-size:13px; margin-bottom:12px;}
.pd-cover{height:160px; border-radius:20px; margin-bottom:16px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;}
.pd-cover svg{width:80px; height:80px;}
.pd-body{padding:0 16px calc(24px + env(safe-area-inset-bottom));}
.pd-day{display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--border); gap:10px;}
.pd-day:last-child{border-bottom:none;}
.pd-day-exs{padding:6px 0 10px; display:none;}
.pd-day-exs.open{display:block;}
.pd-day-ex-row{display:flex; justify-content:space-between; padding:6px 0; font-size:13px; color:var(--text-secondary); gap:10px;}

.shimmer{background:linear-gradient(90deg, var(--surface-hover) 25%, rgba(255,255,255,.1) 37%, var(--surface-hover) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:8px; height:14px; margin-bottom:8px;}
@keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}
.ai-tip{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px;}
.ai-tip:last-child{border-bottom:none;}

.ach-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px;}
.ach-badge{aspect-ratio:1; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:18px; background:var(--surface-hover); border:1px solid var(--border); opacity:.35; filter:grayscale(1);}
.ach-badge.unlocked{background:linear-gradient(135deg, rgba(0,229,255,.25), rgba(255,107,53,.15)); border-color:var(--accent); opacity:1; filter:none;}

.premium-screen{position:fixed; inset:0; z-index:36; background:var(--bg); overflow-y:auto; transform:translateX(100%); transition:transform .35s cubic-bezier(.4,0,.2,1); scrollbar-width:none;}
.premium-screen.show{transform:translateX(0);}
.pf-row{display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px;}
.pf-row:last-child{border-bottom:none;}
.price-card{background:linear-gradient(135deg, rgba(0,229,255,.12), rgba(255,107,53,.08)); border:1px solid var(--border-strong); border-radius:18px; padding:20px; text-align:center; margin:16px 0;}

[data-theme="light"]{--bg:#F6F7FA; --bg-elevated:#FFFFFF; --surface:rgba(0,0,0,.03); --surface-hover:rgba(0,0,0,.06); --border:rgba(0,0,0,.08); --border-strong:rgba(0,0,0,.14); --text:#0A0B0F; --text-secondary:#5A5C66; --text-tertiary:#8B8D98; --accent:#0097B2; --accent-glow:rgba(0,151,178,.3); --accent-secondary:#FF6B35;}
[data-theme="light"] .dock{background:rgba(255,255,255,.88);}
.pbadge{display:inline-block; font-size:10px; font-weight:800; letter-spacing:.8px; color:var(--accent); background:rgba(0,229,255,.12); padding:3px 8px; border-radius:999px; margin-left:6px; vertical-align:middle; text-transform:uppercase;}
.lockbox{position:relative;}
.lockbox.locked .lk-content{filter:blur(6px); pointer-events:none; user-select:none;}
.lk-over{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
.seg{display:flex; gap:8px; margin-bottom:4px;}
.seg-b{flex:1; padding:12px; border-radius:12px; background:var(--surface); border:1px solid var(--border); font-weight:700; font-size:14px;}
.seg-b.sel{background:var(--accent); color:#0A0B0F; border-color:var(--accent);}
.m-row{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px; font-variant-numeric:tabular-nums;}
.m-row span:first-child{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.m-row b{flex-shrink:0; white-space:nowrap; text-align:right; font-variant-numeric:tabular-nums;}
.m-row:last-child{border-bottom:none;}

.pills{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin-bottom:14px;}
.pill{flex-shrink:0; padding:9px 16px; border-radius:999px; background:var(--surface); border:1px solid var(--border); font-weight:700; font-size:13px;}
.pill.sel{background:var(--accent); color:#0A0B0F; border-color:var(--accent);}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
.chip{font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; background:var(--surface-hover); color:var(--text-secondary);}
.q-emoji{font-size:32px; width:44px; text-align:center; flex-shrink:0;}
.pop{position:fixed; left:50%; top:40%; font-size:44px; font-weight:800; color:var(--accent); animation:popUp 1s ease forwards; z-index:60; pointer-events:none;}
@keyframes popUp{0%{transform:translate(-50%,0) scale(.5); opacity:0;}30%{transform:translate(-50%,-20px) scale(1.2); opacity:1;}100%{transform:translate(-50%,-80px) scale(1); opacity:0;}}
.cf{position:fixed; top:-10px; width:8px; height:8px; border-radius:50%; animation:cfall 1.6s linear forwards; z-index:60; pointer-events:none;}
@keyframes cfall{to{transform:translateY(105vh) rotate(360deg); opacity:.8;}}
.cal-cell{aspect-ratio:1; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; border:1px solid transparent; background:var(--surface); color:var(--text-tertiary);}
.cal-cell.today{border-color:var(--accent);}
.cal-cell.future{background:transparent; border:1px dashed var(--border);}
.measure-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); font-size:14px;}
.measure-delta{font-size:12px; font-weight:700; color:var(--text-tertiary);}
.measure-delta.up{color:var(--success);}
.measure-delta.down{color:var(--danger);}
.slides{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; gap:12px; padding:0 16px;}
.slide{flex:0 0 100%; scroll-snap-align:center; min-height:52vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; border-radius:24px; background:linear-gradient(135deg, rgba(0,229,255,.12), rgba(255,107,53,.08)); border:1px solid var(--border);}
.tech-tips li{margin:0 0 8px 18px; font-size:14px; color:var(--text-secondary);}
.report-table{width:100%; border-collapse:collapse;}
.report-table td{padding:10px 12px; border-bottom:1px solid var(--border); font-size:14px;}
.report-table tr.day-row td{background:var(--surface-hover); font-weight:700; padding:12px; text-align:left;}
.report-table td:first-child{color:var(--text-secondary); width:40px; text-align:center;}
.report-table td:nth-child(3), .report-table td:nth-child(4){text-align:right; font-variant-numeric:tabular-nums;}
</style>
</head>
<body>

function emptyProfile(){ return {gender:null, age:null, height:null, weight:null, targetWeight:null, activity:null, weightHistory:[], measures:[]}; }
let state = loadState();
function loadState(){
  try{ const s = JSON.parse(localStorage.getItem('gymflow_state')); if(s){ migrate(s); return s; } }catch(e){}
  return {
    user:{goal:null,level:null,program:null,name:firstName(),customPrograms:[],restTime:90,isPremium:false,
      profile:emptyProfile(),questPoints:0,streakFreezes:1,frozenDays:[],freezeLastGrant:null,premiumFreezeGrant:null,
      playlists:[],activePlaylist:0,reminders:null},
    quests:{date:null,items:[],completedCount:0}, waterLog:{date:null,ml:0}, waterHistory:[], sleepLog:{date:null,hours:0}, sleepHistory:[], dailyCalories:[], theme:'dark',
    workouts:[], currentDayIndex:0, points:0, onboardingDone:false, achievements:[]
  };
}
function migrate(s){
  if(!s.user) s.user = {};
  if(!s.user.customPrograms) s.user.customPrograms = [];
  if(!s.user.restTime) s.user.restTime = 90;
  if(s.user.isPremium===undefined) s.user.isPremium = false;
  if(!s.achievements) s.achievements = [];
  s.user.profile = Object.assign(emptyProfile(), s.user.profile||{});
  if(!Array.isArray(s.user.profile.weightHistory)) s.user.profile.weightHistory = [];
  if(!Array.isArray(s.user.profile.measures)) s.user.profile.measures = [];
  if(!s.theme) s.theme = 'dark';
  s.user.questPoints = s.user.questPoints||0;
  s.user.streakFreezes = s.user.streakFreezes ?? 1;
  s.user.frozenDays = s.user.frozenDays||[];
  s.user.freezeLastGrant = s.user.freezeLastGrant||null;
  s.user.premiumFreezeGrant = s.user.premiumFreezeGrant||null;
  s.quests = s.quests || {date:null,items:[],completedCount:0};
  s.waterLog = s.waterLog || {date:null,ml:0};
s.waterHistory = s.waterHistory || [];
s.sleepLog = s.sleepLog || {date:null,hours:0};
s.sleepHistory = s.sleepHistory || [];
s.dailyCalories = s.dailyCalories || [];  s.user.playlists = s.user.playlists || [];
  if(s.user.activePlaylist === undefined) s.user.activePlaylist = 0;
  if(s.user.musicPlaylist){ s.user.playlists.push({name:'Мой плейлист',url:s.user.musicPlaylist}); delete s.user.musicPlaylist; }
  s.workouts = (s.workouts||[]).map(w=>{
    if(w.exercises) return w;
    const byEx = {};
    (w.sets||[]).forEach(set => { (byEx[set.exercise] = byEx[set.exercise]||[]).push({weight:set.weight,reps:set.reps}); });
    return {name:w.name,date:w.date,duration:w.duration,exercises:Object.entries(byEx).map(([name,sets])=>({name,sets}))};
  });
}

const ACT_K = {sedentary:1.2, light:1.375, medium:1.55, high:1.725, extreme:1.9};
const ACTS = [
  {id:'sedentary',t:'Сидячий',s:'Мало движения, офисная работа'},

  {id:'extreme',t:'Очень высокий',s:'Физ. работа + тренировки'}
];
const RW_TABLE = [['Приседания',[.5,1,1.5]],['Жим штанги лёжа',[.4,.8,1.2]],['Становая',[.6,1.2,1.8]],['Жим стоя',[.3,.5,.8]],['Румынская тяга',[.5,1,1.5]],['Тяга штанги в наклоне',[.4,.7,1]],['Подтягивания',[0,.15,.35]]];
function calcBMI(w,h){ return Math.round(w/Math.pow(h/100,2)*10)/10; }
function bmiCat(b){ return b<18.5?{t:'Недовес',c:'#60A5FA'} : b<25?{t:'Норма',c:'var(--accent)'} : b<30?{t:'Избыток',c:'var(--gold)'} : {t:'Ожирение',c:'var(--danger)'}; }
function calcBMR(g,w,h,a){ return Math.round(10*w + 6.25*h - 5*a + (g==='male'?5:-161)); }
function calcTDEE(bmr,act){ return Math.round(bmr*(ACT_K[act]||1.2)); }
function calcTargetCalories(tdee,goal){ return Math.round(tdee*(goal==='lose'?.85:goal==='gain'?1.15:1)); }
function calcMacros(cal,w){ const p=1.8*w, f=.9*w; return {protein:Math.round(p), fat:Math.round(f), carbs:Math.max(0,Math.round((cal-p*4-f*9)/4))}; }
function calcWater(w){ return Math.round(w*35/100)/10; }
function calcGoalForecast(cur,target,targetCal,tdee){
  const need = target-cur, delta = targetCal-tdee;
  if(need===0) return {days:0, date:new Date()};
  if(!delta || Math.sign(need)!==Math.sign(delta)) return null;
  const days = Math.ceil(Math.abs(need)*7700/Math.abs(delta));
  return {days, date:new Date(Date.now()+days*86400000)};
}
function recommendedWeights(w,level){
  const i = level==='advanced'?2 : level==='medium'?1 : 0;
  return RW_TABLE.map(([name,k])=>({name, weight:Math.floor(w*k[i]/2.5)*2.5, unit:name==='Подтягивания'?'доп. кг':'кг'}));
}
function inR(v,a,b){ return typeof v==='number' && isFinite(v) && v>=a && v<=b; }
function pfValid(d){ return (d.gender==='male'||d.gender==='female') && inR(d.age,14,90) && inR(d.height,120,220) && inR(d.weight,30,200) && inR(d.targetWeight,30,200) && !!ACT_K[d.activity]; }
function metrics(){
  const p = state.user.profile; if(!pfValid(p)) return null;
  const bmr = calcBMR(p.gender,p.weight,p.height,p.age);
  const tdee = calcTDEE(bmr,p.activity);
  const tc = calcTargetCalories(tdee,state.user.goal);
  return {bmi:calcBMI(p.weight,p.height), bmr, tdee, tc, macros:calcMacros(tc,p.weight), water:calcWater(p.weight)};
}

function currentProgram(){ return allPrograms()[state.user.program] || PROGRAMS.fullbody; }
function todayDay(){ const prog=currentProgram(); return prog.days[state.currentDayIndex % prog.days.length]; }
function weekCompleted(){ const wk=7*24*3600*1000, now=Date.now(); return state.workouts.filter(w=>now-new Date(w.date).getTime()<wk).length; }
function rawStreak(){
  if(!state.workouts.length) return 0;
  let s=0; const day=24*3600*1000; let cursor=new Date().setHours(0,0,0,0);
  const dates = new Set(state.workouts.map(w=>new Date(w.date).setHours(0,0,0,0)));
  while(dates.has(cursor)){ s++; cursor -= day; }
  return s;
}
function totalVolume(){ let v=0; state.workouts.forEach(w=>w.exercises.forEach(e=>e.sets.forEach(s=>v+=s.weight*s.reps))); return Math.round(v); }
function monthVolume(from=0){
  const now=Date.now(), mo=30*86400000; let v=0;
  state.workouts.forEach(w=>{ const t=new Date(w.date).getTime(); if(now-t<mo+from*mo && now-t>=from*mo) w.exercises.forEach(e=>e.sets.forEach(s=>v+=s.weight*s.reps)); });
  return Math.round(v);
}
function totalSets(){ let c=0; state.workouts.forEach(w=>w.exercises.forEach(e=>c+=e.sets.length)); return c; }
function maxWeightFor(name){ let m=0; state.workouts.forEach(w=>w.exercises.forEach(e=>{ if(e.name===name) e.sets.forEach(s=>{ if(s.weight>m) m=s.weight; }); })); return m; }
function personalRecords(){
  const best={}; state.workouts.forEach(w=>w.exercises.forEach(e=>e.sets.forEach(s=>{ if(!best[e.name]||s.weight>best[e.name]) best[e.name]=s.weight; })));
  return Object.entries(best).sort((a,b)=>b[1]-a[1]).slice(0,5);
}
function exerciseProgress(){
  const agg={};
  state.workouts.forEach(w=>w.exercises.forEach(e=>{
    if(!agg[e.name]) agg[e.name]={max:0,sets:0,sessions:[]};
    const maxInSession = Math.max(...e.sets.map(s=>s.weight));
    agg[e.name].sets += e.sets.length; if(maxInSession>agg[e.name].max) agg[e.name].max = maxInSession;
    agg[e.name].sessions.push({date:w.date, max:maxInSession});
  }));
  return Object.entries(agg);
}
function sparkline(sessions){
  const last = sessions.slice(-5); if(last.length<2) return '';
  const max = Math.max(...last.map(s=>s.max)), min = Math.min(...last.map(s=>s.max));
  const pts = last.map((s,i)=>{ const x=i/(last.length-1)*60; const y=max===min?10:20-((s.max-min)/(max-min))*18; return `${x},${y}`; }).join(' ');
  return `<svg class="spark" width="60" height="20" viewBox="0 0 60 20"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function lastWorkoutWith(name){
  const list = state.workouts.filter(w=>w.exercises.some(e=>e.name===name)).sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!list.length) return null;
  const w = list[0]; const ex = w.exercises.find(e=>e.name===name);
  const maxSet = ex.sets.reduce((a,s)=> s.weight>=(a?a.weight:0) ? s : a, null);
  return {date:w.date, set:maxSet};
}

/* ---------- STREAK + FREEZE ---------- */
function streak(){
  if(!state.workouts.length) return 0;
  const frozen = new Set(state.user.frozenDays||[]);
  const has = new Set(state.workouts.map(w=>dk(w.date)));
  const ok = d => has.has(dk(d)) || frozen.has(dk(d));
  let c = new Date(); c.setHours(12,0,0,0);
  if(!ok(c)) c = new Date(c.getTime()-86400000);
  let s=0; for(let i=0;i<365&&ok(c);i++){ s++; c = new Date(c.getTime()-86400000); }
  return s;
}
function dayActive(k){ return state.workouts.some(w=>dk(w.date)===k) || (state.user.frozenDays||[]).includes(k); }
function canUseFreeze(){
  const y = dk(Date.now()-86400000), yy = dk(Date.now()-2*86400000);
  if((state.user.streakFreezes||0)<=0) return {ok:false, reason:'Нет доступных заморозок'};
  if(state.workouts.some(w=>dk(w.date)===y)) return {ok:false, reason:'Вчера ты тренировался — серия в порядке'};
  if((state.user.frozenDays||[]).includes(y)) return {ok:false, reason:'Вчера уже заморожен'};
  if(!dayActive(yy)) return {ok:false, reason:'Серия уже прервалась — заморозка не поможет'};

function waterNorm(){
  const w = state.user.profile?.weight;
  if(w) return Math.round(w*30/100)/10;
  return 2.5;
}
function waterToday(){
  const h = state.waterLog;
  return (h && h.date === todayStr()) ? (h.ml||0) : 0;
}
function waterTotal(){
  if(!state.waterHistory || !state.waterHistory.length) return 0;
  return state.waterHistory.reduce((s,x)=>s+(x.ml||0),0);
}
function waterStreakDays(){
  if(!state.waterHistory || !state.waterHistory.length) return 0;
  const norm = waterNorm()*1000;
  const byDate = {};
  state.waterHistory.forEach(x=>{ byDate[x.date]=x.ml||0; });
  let s=0; let cursor = new Date();
  for(let i=0;i<365;i++){
    const k = cursor.toLocaleDateString('sv-SE');
    if((byDate[k]||0) >= norm){ s++; cursor.setDate(cursor.getDate()-1); }
    else break;
  }
  return s;
}
function waterState(){
  if(!state.waterLog || state.waterLog.date !== todayStr())
    state.waterLog = {date:todayStr(), ml:0};
  return state.waterLog;
}
function sleepState(){
  if(!state.sleepLog || state.sleepLog.date !== todayStr())
    state.sleepLog = {date:todayStr(), hours:0};
  return state.sleepLog;
}
function setSleep(hours){
  const s = sleepState();
  s.hours = Math.max(0, Math.min(12, hours));
  const t = todayStr();
  if(!state.sleepHistory) state.sleepHistory = [];
  const h = state.sleepHistory.find(x => x.date === t);
  if(h) h.hours = s.hours;
  else state.sleepHistory.push({date:t, hours:s.hours});
  state.sleepHistory = state.sleepHistory.slice(-30);

}
function sleepCard(){

function waterCard(){
  const s = waterState();
  const norm = waterNorm();
  const liters = (s.ml/1000).toFixed(2).replace(/\.?0+$/,'');
  const pct = Math.min(100, s.ml/(norm*1000)*100);
  const R=28, C=2*Math.PI*R, off=C*(1-pct/100);
  const hist = (state.waterHistory||[]).slice(-7);
  let chart = '';
  if(hist.length >= 2){
    const maxV = Math.max(norm*1000, ...hist.map(x=>x.ml));
    const W = 280, H = 50;
    const pts = hist.map((x,i)=>{
      const px = (i/(hist.length-1))*W;
      const py = H - (x.ml/maxV)*H;
      return `${px.toFixed(1)},${py.toFixed(1)}`;
    }).join(' ');
    chart = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="margin-top:12px;">
      <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="sub" style="font-size:11px; text-align:center; margin-top:2px;">последние ${hist.length} дн.</div>`;
  } else {
    chart = `<div class="sub" style="font-size:12px; text-align:center; margin-top:10px;">Добавляй воду несколько дней — построим график</div>`;
  }

          <circle cx="35" cy="35" r="${R}" stroke="var(--accent)" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 35 35)" style="transition:stroke-dashoffset .5s"/>
        </svg>
        <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;">${Math.round(pct)}%</div>
      </div>
      <div style="flex:1; text-align:right;">
        <div class="stat-num" style="font-size:26px;">${liters} / ${norm} л</div>
        <div class="sub">${s.ml} мл сегодня</div>
      </div>
    </div>
    <div class="btn-row" style="margin-top:14px; gap:6px;">
      <button class="btn-secondary" data-water="-0.25" style="padding:10px 6px; font-size:12px;">−250</button>

      <button class="btn-primary" data-water="1" style="padding:10px 6px; font-size:12px;">+1 л</button>
    </div>
    ${chart}
  </div>`;
}
function waterStep(liters){
  const s = waterState();
  const was = s.ml;
  s.ml = Math.max(0, s.ml + Math.round(liters*1000));
  const t = todayStr();
  if(!state.waterHistory) state.waterHistory = [];

  if(h) h.ml = s.ml;

  state.waterHistory = state.waterHistory.slice(-30);
  saveState();

  if(was<norm && s.ml>=norm){ notify('success'); popup('Норма воды закрыта! 💧','Отличная работа.'); }

function noteBlock(cur){
  const n = lastNote(cur.name);
  return `${n?`<div class="hint-card">📝 Прошлый раз: ${escH(n)}</div>`:''}<label style="font-size:12px; color:var(--text-secondary); display:block; margin-bottom:6px;">📝 Заметка</label><textarea id="exNote" rows="2" maxlength="200" placeholder="Что запомнить про это упражнение?" style="margin-bottom:16px;">${escH(cur.note||'')}</textarea>`;
}
document.addEventListener('input', e => { if(e.target.id==='exNote' && session) session.exercises[session.exIndex].note = e.target.value.slice(0,200); });
function lastNote(name){ const w=[...state.workouts].sort((a,b)=>new Date(b.date)-new Date(a.date)).find(w=>w.exercises.some(e=>e.name===name&&e.note)); return w?w.exercises.find(e=>e.name===name).note:''; }
function exerciseHistory(name){
  return state.workouts.filter(w=>w.exercises.some(e=>e.name===name)).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5).map(w=>{ const e=w.exercises.find(x=>x.name===name); return {date:w.date, sets:e.sets, max:Math.max(...e.sets.map(s=>s.weight))}; });
}
function historyHTML(name){
  const h = exerciseHistory(name); if(!h.length) return '';
  return `<div style="margin-top:20px;"><div class="h2">📈 История</div>${h.map(x=>`<div class="m-row"><span>${new Date(x.date).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})} — ${x.sets.map(s=>s.weight+'×'+s.reps).join(', ')}</span><b>макс ${x.max} кг</b></div>`).join('')}${sparkline([...h].reverse())}</div>`;
}
function getOverloadHint(name){
  const info = lastWorkoutWith(name);
  if(!info || !info.set) return null;
  const key = 'ov_'+name+'_'+info.date;
  if(hintStore()[key]) return null;
  markHintShown(key);
  if(info.set.reps>=12) return `В прошлый раз: ${info.set.weight} кг × ${info.set.reps}. Попробуй ${info.set.weight+2.5} кг сегодня!`;
  if(info.set.reps<8) return `В прошлый раз было тяжело (${info.set.reps} повт. на ${info.set.weight} кг). Попробуй тот же вес.`;
  return null;
}
function maybeSuggestProgress(ex){
  if(ex.sets.length<3) return;
  const w = ex.sets[0].weight;
  const allSame = ex.sets.every(s=>s.weight===w && s.reps>=12);
  if(!allSame) return;
  const key = 'progress_'+ex.name+'_'+new Date().toDateString();
  if(hintStore()[key]) return;
  markHintShown(key);
  popup('Ты готов к прогрессу! 📈', `Поднять вес в «${ex.name}» на 2.5 кг в следующий раз?`);
}

/* ---------- REST TIMER ---------- */
let restInterval = null;
function showRestTimer(onDone){
  const bar = $('restBar');
  let remaining = state.user.restTime;
  const total = remaining;
  function render(){
    bar.innerHTML = `
      <div class="rest-num">${remaining}с</div>
      <div class="rest-track"><div class="rest-fill" style="width:${remaining/total*100}%"></div></div>
      <div class="rest-dur">${[60,90,120].map(d=>`<div class="rest-dur-btn tappable ${state.user.restTime===d?'sel':''}" data-d="${d}">${d}с</div>`).join('')}</div>
      <div class="btn-row"><button class="btn-secondary" id="restSkip">Пропустить</button><button class="btn-secondary" id="restPlus">+30 сек</button></div>
    `;
    bar.querySelectorAll('[data-d]').forEach(b=>{ b.addEventListener('click', ()=>{ haptic('light'); state.user.restTime=parseInt(b.dataset.d); saveState(); remaining=state.user.restTime; render(); }); });
    $('restSkip').addEventListener('click', finish);
    $('restPlus').addEventListener('click', ()=>{ haptic('light'); remaining+=30; render(); });
  }
  function finish(){ clearInterval(restInterval); bar.classList.remove('show'); onDone(); }
  render();
  bar.classList.add('show');
  restInterval = setInterval(()=>{
    remaining--;
    if(remaining<=0){ notify('success'); trackQuestEvent('rest_timer_use',1); finish(); return; }
    const track = bar.querySelector('.rest-fill'); const num = bar.querySelector('.rest-num');
    if(track) track.style.width = (remaining/total*100)+'%';
    if(num) num.textContent = remaining+'с';
  }, 1000);
}
function estimateWorkoutCalories(){
  // приблизительная оценка: 6-8 ккал в минуту для силовой тренировки
  const s = session; if(!s) return 0;
  const sets = s.exercises.reduce((a,e)=>a+e.sets.length,0);
  const vol = s.exercises.reduce((a,e)=>a+e.sets.reduce((ss,st)=>ss+st.weight*st.reps,0),0);
  const minutes = Math.max(20, Math.round(vol / 200)); // условная формула
  return Math.round(minutes * 7); // ~7 ккал/мин
}
function saveDailyCalories(){
  const kcal = estimateWorkoutCalories();
  const t = todayStr();
  if(!state.dailyCalories) state.dailyCalories = [];
  const h = state.dailyCalories.find(x => x.date === t);
  if(h) h.kcal = (h.kcal||0) + kcal;
  else state.dailyCalories.push({date:t, kcal});
  state.dailyCalories = state.dailyCalories.slice(-30);
}
function caloriesCard(){
  const hist = (state.dailyCalories||[]).slice(-7);
  if(hist.length < 2) return '';
  const m = metrics();
  const tdee = m ? m.tdee : 2000;
  const maxV = Math.max(tdee*0.3, ...hist.map(x=>x.kcal));
  const W = 280, H = 60;
  const bars = hist.map((x,i)=>{
    const bw = W/hist.length - 6;
    const bx = i * (W/hist.length) + 3;
    const bh = (x.kcal/maxV) * H;
    const by = H - bh;
    return `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="var(--accent)" opacity="0.7"/>`;
  }).join('');
  return `<div class="card">
    <div class="h2">🔥 Сожжено на тренировках</div>
    <div class="sub" style="margin:0 0 8px;">За последние ${hist.length} дней</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block;">
      ${bars}
    </svg>
    <div class="sub" style="font-size:11px; text-align:center; margin-top:6px;">${hist[hist.length-1].kcal||0} ккал сегодня · ~${tdee} ккал/день твой TDEE</div>
  </div>`;
}
function finishWorkout(){
  const totalSetsCount = session.exercises.reduce((a,e)=>a+e.sets.length,0);
  state.workouts.push({name:session.day.label, date:new Date().toISOString(), duration:totalSetsCount*3, exercises:session.exercises.filter(e=>e.sets.length)});
    state.currentDayIndex++; state.points += totalSetsCount*10;
  saveDailyCalories();
  saveState();
  $('workoutScreen').classList.remove('show');
  session = null;
  notify('success'); haptic('medium'); setTimeout(()=>haptic('medium'),150);
  afterWorkout();
  checkAchievements();
  renderHome();
}

/* ---------- HEATMAP ---------- */
function dailyAgg(){
  const map={};
  state.workouts.forEach(w=>{
    const key = new Date(w.date).toDateString();
    if(!map[key]) map[key] = {exCount:0, volume:0};
    map[key].exCount += w.exercises.length;
    w.exercises.forEach(e=>e.sets.forEach(s=>map[key].volume += s.weight*s.reps));
  });
  return map;
}
function heatColor(c){ if(!c) return 'var(--border)'; if(c<=2) return 'rgba(0,229,255,0.2)'; if(c<=4) return 'rgba(0,229,255,0.5)'; return 'var(--accent)'; }
function renderHeatmap(){
  const agg = dailyAgg(); const days = 168; const today = new Date(); today.setHours(0,0,0,0); const cells = [];
  for(let i=days-1;i>=0;i--){
    const d = new Date(today.getTime()-i*86400000); const key = d.toDateString(); const data = agg[key]||{exCount:0,volume:0};
    cells.push(`<div class="hm-cell tappable" style="background:${heatColor(data.exCount)}" data-date="${d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}" data-count="${data.exCount}" data-vol="${Math.round(data.volume)}"></div>`);
  }
  return `<div class="heatmap-scroll"><div class="heatmap-grid">${cells.join('')}</div></div>
    <div id="hmTooltip" class="sub">Нажми на день, чтобы увидеть детали</div>
    <div class="legend">меньше<div class="hm-cell" style="background:var(--border)"></div><div class="hm-cell" style="background:rgba(0,229,255,0.2)"></div><div class="hm-cell" style="background:rgba(0,229,255,0.5)"></div><div class="hm-cell" style="background:var(--accent)"></div>больше</div>`;
}

/* ---------- LOCAL AI INSIGHTS ---------- */
function generateLocalInsights(){
  const tips = [];
  if(state.workouts.length===0) return ['Начни первую тренировку, чтобы увидеть персональные инсайты 💪'];
  const st = streak();
  if(st>=2) tips.push(`🔥 Твоя лучшая серия — ${st} ${st===1?'день':'дня/дней'}. Не разрывай её сегодня!`);
  const prog = exerciseProgress().filter(([,d])=>d.sessions.length>=2).sort((a,b)=>b[1].sessions.length-a[1].sessions.length)[0];
  if(prog){ const s=prog[1].sessions; const first=s[0].max, last=s[s.length-1].max; if(last>first) tips.push(`📊 Средний вес в «${prog[0]}» вырос с ${first} до ${last} кг.`); }
  const muscleCount = {};
  state.workouts.forEach(w => w.exercises.forEach(e => { const m = (EXERCISES[e.name]||{}).muscle; if(m) muscleCount[m] = (muscleCount[m]||0)+1; }));
  const sortedM = Object.entries(muscleCount).sort((a,b)=>b[1]-a[1]);
  if(sortedM.length>=2){ const all = ['Грудь','Спина','Ноги','Плечи','Руки','Пресс']; const lagging = all.find(m=>!muscleCount[m]) || sortedM[sortedM.length-1][0]; tips.push(`💪 Ты чаще всего тренируешь ${sortedM[0][0].toLowerCase()}. Добавь упражнений на ${lagging.toLowerCase()}.`); }
  const thisMo = monthVolume(0), prevMo = monthVolume(1);
  if(prevMo>0){ const diff = Math.round((thisMo-prevMo)/prevMo*100); tips.push(`⚡ Объём за месяц: ${thisMo} кг — это ${diff>=0?'больше':'меньше'} прошлого на ${Math.abs(diff)}%.`); }
  return tips.slice(0,3);
}

function weightSpark(h){
  h = h.slice(-30); if(h.length<2) return '<div class="sub">Добавь ещё одно взвешивание — построим график.</div>';
  const ws = h.map(x=>x.weight), mx = Math.max(...ws), mn = Math.min(...ws);
  const pts = ws.map((w,i)=>(i/(ws.length-1)*280).toFixed(1)+','+(mx===mn?25:(46-((w-mn)/(mx-mn))*42).toFixed(1))).join(' ');

function generateDailyQuests(){
  if(state.quests.date===todayStr() && state.quests.items.length) return;
  const pool = [...QUEST_POOL];
  for(let i=pool.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [pool[i],pool[j]] = [pool[j],pool[i]]; }
  state.quests = {date:todayStr(), items:pool.slice(0,3).map(q=>({id:q.id,icon:q.icon,title:q.title,desc:q.desc,reward:q.reward,target:q.target,progress:0,done:false,claimed:false})), completedCount:0};
  saveState();
}
function trackQuestEvent(name,value=1){
  generateDailyQuests();
  const it = state.quests.items.find(q=>q.id===name); if(!it||it.done) return;
  it.progress = Math.min(it.target, it.progress+value);
  it.done = it.progress >= it.target;
  saveState();
}
function weekVolume(){ const now=Date.now(); let v=0; state.workouts.forEach(w=>{ if(now-new Date(w.date).getTime()<7*86400000) w.exercises.forEach(e=>e.sets.forEach(s=>v+=s.weight*s.reps)); }); return Math.round(v); }
function afterWorkout(){
  const w = state.workouts[state.workouts.length-1]; if(!w) return;
  const h = new Date().getHours(); let sets=0, vol=0, sq=0, bp=0;
  w.exercises.forEach(e => { sets += e.sets.length; e.sets.forEach(s => vol += s.weight*s.reps); if(e.name==='Приседания' && e.sets.length>=3) sq += e.sets.length; if(e.name==='Жим штанги лёжа' && e.sets.length>=3) bp += e.sets.length; });
  trackQuestEvent('workout_complete',1); trackQuestEvent('sets_15',sets); trackQuestEvent('volume_3000',Math.round(vol));
  if(sq) trackQuestEvent('squat_3',sq); if(bp) trackQuestEvent('bench_3',bp);
  if(h<10) trackQuestEvent('morning_workout',1); if(h>=19) trackQuestEvent('evening_workout',1);
  if(streak()>=3) trackQuestEvent('streak_3',1); if(weekVolume()>=10000) trackQuestEvent('volume_week_10k',1);
  popupBtns('Готово! 🎉','Тренировка завершена!',[{id:'share',type:'default',text:'Поделиться'},{type:'ok'}],id=>{ if(id==='share') shareWorkoutCard(); });
}

function fitFont(x,text,w,size,maxW){ while(size>36){ x.font = `${w} ${size}px Manrope, sans-serif`; if(x.measureText(text).width <= maxW) break; size -= 4; } x.font = `${w} ${size}px Manrope, sans-serif`; }
function drawCardToCanvas(cfg){

  x.save(); x.translate(80,150); x.scale(3.6,3.6); const lg = x.createLinearGradient(0,0,32,32); lg.addColorStop(0,'#00E5FF'); lg.addColorStop(1,'#FF6B35'); x.fillStyle = lg; x.fill(new Path2D('M20 5 10 17h6l-2 10 10-13h-6z')); x.restore();
  x.textBaseline = 'alphabetic'; x.textAlign = 'left'; x.fillStyle = '#FFFFFF'; x.font = '800 48px Manrope, sans-serif'; x.fillText('GymFlow',215,225);
  x.fillStyle = 'rgba(255,255,255,0.4)'; x.font = '500 26px Manrope, sans-serif'; x.fillText(new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}),80,130);
  x.textAlign = 'center'; x.fillStyle = '#FFFFFF'; fitFont(x,cfg.main,800,140,940); x.fillText(cfg.main,540,720);
  x.fillStyle = '#8B8D98'; x.font = '500 42px Manrope, sans-serif'; x.fillText(cfg.caption,540,800); x.fillText('в GymFlow',540,860);
  const mets = [['Тренировок',state.workouts.length],['Объём, кг',totalVolume()],['Серия',streak()],['Достижений',state.achievements.length]];
  mets.forEach(([l,v],i) => { const cx = 80+115+i*230; x.fillStyle = '#FFFFFF'; fitFont(x,String(v),800,56,200); x.fillText(String(v),cx,1250); x.fillStyle = '#8B8D98'; x.font = '500 28px Manrope, sans-serif'; x.fillText(l,cx,1305); if(i>0){ x.fillStyle = 'rgba(255,255,255,0.14)'; x.fillRect(80+i*230,1180,2,150); } });
  x.fillStyle = '#00E5FF'; x.font = '600 36px Manrope, sans-serif'; x.fillText('Тренируйся со мной в GymFlow',540,1740);
  x.fillStyle = '#8B8D98'; x.font = '500 28px Manrope, sans-serif'; x.fillText('@mygymflow_bot',540,1820);
  return c;
}

      <div class="h1">${escH(name)}</div>
      <div class="sub" style="margin-top:4px;">${escH(e.muscle||'')}</div>
    </div>
    <div class="label" style="margin-bottom:8px;">Техника выполнения</div>
    <ul class="tech-tips" style="margin-bottom:16px;">${tips}</ul>
    <a href="https://www.youtube.com/results?search_query=${ytQuery}" target="_blank" class="btn-secondary" style="width:100%; text-decoration:none; display:flex; justify-content:center;">▶️ Найти видео на YouTube</a>
  `);
}

/* ---------- MUSIC ---------- */
function musicCard(){
  const pl = state.user.playlists || [];
  const active = state.user.activePlaylist;
  return `<div class="card"><div class="h2">🎵 Музыка для тренировок</div>
    ${pl.length ? `<div style="margin-bottom:12px;">${pl.map((p,i)=>`<div class="ex-row">
      <div class="ex-icon" style="font-size:18px;">${i===active?'🎧':'🎵'}</div>
      <div style="flex:1;" class="tappable" data-plact="${i}"><div class="ex-name">${escH(p.name)}</div><div class="ex-muscle">${i===active?'активный · нажми ▶️':'нажми, чтобы сделать активным'}</div></div>
      <div class="tappable" data-pldel="${i}" style="color:var(--danger); font-size:22px; padding:0 8px;">×</div>
    </div>`).join('')}</div>` : ''}
    <div class="btn-row" style="margin-bottom:12px;">
      <button class="btn-primary" data-mplay ${pl.length?'':'disabled'}>▶️ Играть</button>
      <button class="btn-secondary" data-mopen ${pl.length?'':'disabled'}>Открыть</button>
    </div>
    <input id="musicUrl" placeholder="Ссылка на плейлист Яндекс.Музыки" style="margin-bottom:8px;">
    <input id="musicName" placeholder="Название (например, Тяжёлая)" style="margin-bottom:10px;">
    <div class="sub" style="margin:0 0 10px; font-size:12px;">Яндекс.Музыка → плейлист → ⋯ → Поделиться → скопируй ссылку</div>
    <button class="btn-secondary" data-madd style="width:100%;">+ Добавить плейлист</button>
    <div class="label" style="margin:14px 0 8px;">Быстрые подборки</div>
    <div class="pills" style="margin:0;">${[['Тяжёлая','энергичная музыка для силовой'],['Кардио','ритмичная музыка для кардио'],['Растяжка','спокойная музыка для растяжки']].map(([t,q])=>`<button class="pill" data-msearch="${q}">${t}</button>`).join('')}</div>
  </div>`;
}
function addPlaylist(){
  const url = ($('musicUrl').value||'').trim();
  const name = ($('musicName').value||'').trim() || 'Плейлист';
  if(!url.includes('music.yandex')){ alertMsg('Вставь ссылку из Яндекс.Музыки'); return; }
  state.user.playlists = state.user.playlists || [];
  state.user.playlists.push({name, url});
  state.user.activePlaylist = state.user.playlists.length - 1;
  saveState(); haptic('medium'); alertMsg('Плейлист добавлен! 🎵'); renderProfile();
}
function openLinkSafe(u){ if(tg && tg.openLink) tg.openLink(u); else window.open(u,'_blank'); }
function openMusic(){
  const pl = state.user.playlists || [];
  const i = state.user.activePlaylist;
  if(!pl[i]){ alertMsg('Сначала добавь плейлист: Профиль → Музыка'); return; }
  haptic('medium'); openLinkSafe(pl[i].url);
}
function maybeMusicPrompt(){
  if(!state.user.playlists || !state.user.playlists.length) return;
  const k = 'gymflow_music_prompted';
  let last = null; try{ last = localStorage.getItem(k); }catch(e){}
  if(last === todayStr()) return;
  try{ localStorage.setItem(k, todayStr()); }catch(e){}
  popupBtns('Музыка','Включить музыку для тренировки?',[{id:'yes',type:'default',text:'Да'},{id:'no',type:'default',text:'Без музыки'}], id => { if(id==='yes') openMusic(); });
}

/* ---------- CALENDAR ---------- */
let calOff = 0;
function openCalendar(){ calOff = 0; renderCalendar(); $('calScreen').classList.add('show'); }
function renderCalendar(){
  const d = new Date(new Date().getFullYear(), new Date().getMonth()+calOff, 1), y = d.getFullYear(), m = d.getMonth();
  const start = (d.getDay()+6)%7, dim = new Date(y,m+1,0).getDate(), today = todayStr();
  const cnt = {}; state.workouts.forEach(w => { cnt[dk(w.date)] = (cnt[dk(w.date)]||0)+w.exercises.length; });
  let cells = ''; for(let i=0;i<start;i++) cells += '<div></div>';
  for(let day=1; day<=dim; day++){
    const k = y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const c = cnt[k]||0, fut = k>today;
    const bg = fut?'':c>=5?'background:var(--accent); color:#0A0B0F;':c>=3?'background:rgba(0,229,255,.6); color:var(--text);':c>=1?'background:rgba(0,229,255,.3); color:var(--text);':'';
    cells += `<div class="cal-cell tappable ${k===today?'today':''} ${fut?'future':''}" style="${bg}" ${c?`data-calday="${k}"`:''}>${day}</div>`;
  }
  $('calScreen').innerHTML = `<div class="pd-top"><div class="pd-back tappable" id="calBack">← Назад</div><div class="h1" style="margin-bottom:16px;">Календарь</div></div><div class="pd-body"><div class="card"><div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;"><button class="btn-secondary" data-calnav="-1" style="padding:8px 14px;">←</button><div class="h2" style="margin:0; text-transform:capitalize;">${d.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</div><button class="btn-secondary" data-calnav="1" style="padding:8px 14px;" ${calOff>=0?'disabled':''}>→</button></div><div style="display:grid; grid-template-columns:repeat(7,1fr); gap:6px;">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="label" style="text-align:center; font-size:10px;">${x}</div>`).join('')}${cells}</div></div></div>`;
  $('calBack').addEventListener('click', ()=>{ haptic('light'); $('calScreen').classList.remove('show'); });
}
function openDay(k){
  const ws = state.workouts.filter(w=>dk(w.date)===k);
  openSheet(`<div class="sheet-handle"></div><div class="h1" style="margin-bottom:12px;">${new Date(k+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</div>${ws.map(w=>`<div class="h2" style="margin-top:8px;">${escH(w.name)}</div>${w.exercises.map(e=>`<div class="m-row"><span>${escH(e.name)}</span><b>${e.sets.map(s=>s.weight+'×'+s.reps).join(', ')}</b></div>`).join('')}`).join('')}`);
}

/* ---------- WARMUP ---------- */
const WARMUP = [{name:'Круги руками',duration:30},{name:'Наклоны корпуса',duration:30},{name:'Вращения тазом',duration:30},{name:'Приседания без веса',duration:45},{name:'Выпады на месте',duration:30},{name:'Прыжки на месте',duration:30}];
let warmTimer = null;
function beep(){ try{ const c = new (window.AudioContext||window.webkitAudioContext)(), o = c.createOscillator(); o.frequency.value = 880; o.connect(c.destination); o.start(); setTimeout(()=>{ o.stop(); c.close(); },180); }catch(e){} }
function fmt(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function openWarmup(){
  const total = WARMUP.reduce((a,x)=>a+x.duration,0);
  openSheet(`<div class="sheet-handle"></div><div class="h1" style="margin-bottom:6px;">🤸 Разминка</div><div class="sub" id="wuTimer" style="margin:0 0 14px;">Всего ${fmt(total)}</div><div id="wuList">${WARMUP.map((x,i)=>`<div class="m-row" id="wu${i}"><span>${x.name}</span><b>${x.duration} сек</b></div>`).join('')}</div><button class="btn-primary" id="wuStart" style="width:100%; margin-top:16px;">Начать</button>`);
  $('wuStart').addEventListener('click', () => {
    clearInterval(warmTimer); let i=0, left=WARMUP[0].duration, rem=total; haptic('medium'); beep();
    const paint = () => { $('wuTimer').textContent = 'Осталось '+fmt(rem)+' · '+WARMUP[i].name+' · '+left+' с'; WARMUP.forEach((_,j)=>{ const r = $('wu'+j); if(r) r.style.color = j===i?'var(--accent)':j<i?'var(--text-tertiary)':''; }); };
    $('wuStart').disabled = true; paint();
    warmTimer = setInterval(() => {
      if(!$('wuTimer') || !$('sheet').classList.contains('show')){ clearInterval(warmTimer); return; }
      rem--; left--;
      if(left<=0){ i++; if(i>=WARMUP.length){ clearInterval(warmTimer); notify('success'); beep(); $('wuTimer').textContent = 'Разминка завершена! 💪'; return; } left = WARMUP[i].duration; haptic('medium'); beep(); }
      paint();
    }, 1000);
  });
}

/* ---------- MEASURES ---------- */
const MS = [['chest','Грудь'],['waist','Талия'],['hips','Бёдра'],['biceps','Бицепс'],['thigh','Бедро']];
function miniSpark(vals){ const v = vals.slice(-8); if(v.length<2) return ''; const mx = Math.max(...v), mn = Math.min(...v); return `<svg width="50" height="18" viewBox="0 0 50 18"><polyline points="${v.map((x,i)=>(i/(v.length-1)*50).toFixed(1)+','+(mx===mn?9:(16-(x-mn)/(mx-mn)*14).toFixed(1))).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/></svg>`; }
function measuresCard(){
  const ms = state.user.profile.measures || [];
  const rows = MS.map(([k,n]) => {
    const vals = ms.filter(m=>m[k]).map(m=>m[k]); if(!vals.length) return '';
    const cur = vals[vals.length-1], prev = vals.length>1?vals[vals.length-2]:null; let d = '';
    if(prev!=null && cur!==prev){ const diff = Math.round((cur-prev)*10)/10; d = `<span class="measure-delta">${diff>0?'▲':'▼'} ${Math.abs(diff)}</span>`; }
    return `<div class="measure-row"><span>${n}</span><span style="display:flex; gap:10px; align-items:center;">${miniSpark(vals)}<b>${cur} см</b>${d}</span></div>`;
  }).join('');
  return `<div class="card"><div class="h2">📏 Замеры тела</div>${rows||'<div class="sub" style="margin:0 0 12px;">Пока нет замеров</div>'}<div class="grid2" style="margin:12px 0; gap:8px;">${MS.map(([k,n])=>`<div class="field"><label>${n}, см</label><input id="m_${k}" type="number" inputmode="decimal" placeholder="—"></div>`).join('')}</div><button class="btn-primary" data-msr style="width:100%;">Добавить замер сегодня</button></div>`;
}
function saveMeasure(){
  const p = state.user.profile, vals = {};
  MS.forEach(([k]) => { const x = parseFloat($('m_'+k).value); if(isFinite(x) && x>0 && x<300) vals[k] = x; });
  if(!Object.keys(vals).length){ alertMsg('Заполни хотя бы одно поле'); return; }
  p.measures = p.measures || []; const t = todayStr(), e = p.measures.find(m=>m.date===t);
  if(e) Object.assign(e, vals); else p.measures.push(Object.assign({date:t}, vals));
  saveState(); haptic('medium'); renderProfile();
}

/* ---------- REMINDERS ---------- */
const DAYS = [['mon','Пн'],['tue','Вт'],['wed','Ср'],['thu','Чт'],['fri','Пт'],['sat','Сб'],['sun','Вс']];
function rem(){ return Object.assign({enabled:false, time:'18:00', days:['mon','wed','fri']}, state.user.reminders||{}); }
function remindersCard(){
  const r = rem();
  return `<div class="card"><div class="h2">🔔 Напоминания</div><label style="display:flex; align-items:center; gap:10px; margin-bottom:12px;"><input type="checkbox" id="remOn" ${r.enabled?'checked':''} style="width:auto;">Включить напоминания</label><div class="field" style="margin-bottom:12px;"><label>Время</label><input type="time" id="remTime" value="${r.time}"></div><div class="pills" style="margin-bottom:12px;">${DAYS.map(([k,t])=>`<label class="pill" style="display:flex; gap:6px; align-items:center;"><input type="checkbox" class="remDay" value="${k}" ${r.days.includes(k)?'checked':''} style="width:auto;">${t}</label>`).join('')}</div><button class="btn-primary" data-rsave style="width:100%;">Сохранить</button><div class="sub" style="font-size:12px; margin-top:8px;">Настройки сохраняются на устройстве.</div></div>`;
}
function saveReminders(){
  state.user.reminders = {enabled:$('remOn').checked, time:$('remTime').value||'18:00', days:[...document.querySelectorAll('.remDay:checked')].map(x=>x.value)};
  saveState(); haptic('medium'); alertMsg('Напоминания сохранены 🔔');
}

/* ---------- WRAPPED ---------- */
let wrapOff = 0;
const WD = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
function wrappedStats(off=0){
  const now = new Date(), a = new Date(now.getFullYear(),now.getMonth()-off,1), b = new Date(now.getFullYear(),now.getMonth()-off+1,1);
  const ws = state.workouts.filter(w => { const d = new Date(w.date); return d>=a && d<b; });
  const days = {}, ex = {}, mx = {}; let vol = 0;
  ws.forEach(w => { const wd = new Date(w.date).getDay(); days[wd] = (days[wd]||0)+1; w.exercises.forEach(e => { ex[e.name] = (ex[e.name]||0)+1; e.sets.forEach(s => { vol += s.weight*s.reps; if(s.weight>(mx[e.name]||0)) mx[e.name] = s.weight; }); }); });
  const top = o => Object.entries(o).sort((x,y)=>y[1]-x[1])[0];
  const bd = top(days), fv = top(ex); let rec = null;
  Object.entries(mx).forEach(([n,m]) => { let before = 0; state.workouts.forEach(w => { if(new Date(w.date)<a) w.exercises.forEach(e => { if(e.name===n) e.sets.forEach(s => { if(s.weight>before) before = s.weight; }); }); }); const delta = before>0?m-before:0; if(!rec||delta>rec.delta||(rec.delta===0&&delta===0&&m>rec.max)) rec = {name:n,delta,max:m}; });
  return {count:ws.length, volume:Math.round(vol), bestDay:bd?WD[bd[0]]:'—', bestDayCount:bd?bd[1]:0, fav:fv?fv[0]:'—', favCount:fv?fv[1]:0, rec, month:a.toLocaleDateString('ru-RU',{month:'long'})};
}
function openWrapped(off=0){
  wrapOff = off; const s = wrappedStats(off);
  const sl = (e,big,cap) => `<div class="slide"><div style="font-size:56px;">${e}</div><div class="stat-num" style="font-size:44px; margin:12px 0;">${big}</div><div class="sub">${cap}</div></div>`;
  $('wrapScreen').innerHTML = `<div class="pd-top"><div class="pd-back tappable" id="wrBack">← Назад</div><div class="h1" style="margin-bottom:16px; text-transform:capitalize;">${s.month}: итоги</div></div>
    <div class="slides">${sl('🏋️',s.count,'тренировок за месяц')}${sl('📊',s.volume+' кг','общий объём')}${sl('📅',s.bestDay,s.bestDayCount?'лучший день: '+plural(s.bestDayCount,['тренировка','тренировки','тренировок']):'пока нет данных')}${sl('❤️',s.fav,s.favCount?'любимое упражнение · '+s.favCount+' раз':'пока нет данных')}${sl('🚀',s.rec?s.rec.name:'—',s.rec?(s.rec.delta>0?'новый рекорд: +'+s.rec.delta+' кг (до '+s.rec.max+' кг)':'твой максимум: '+s.rec.max+' кг'):'пока нет данных')}</div>
    <div class="pd-body" style="margin-top:16px;"><div class="sub" style="text-align:center; margin-bottom:12px;">Листай в сторону →</div><button class="btn-primary" data-wshare style="width:100%;">📤 Поделиться</button></div>`;
  $('wrapScreen').classList.add('show');
  $('wrBack').addEventListener('click', () => { haptic('light'); $('wrapScreen').classList.remove('show'); });
}
function wrappedCheck(){
  try{
    const now = new Date(), key = now.getFullYear()+'-'+now.getMonth();
    if(state.wrappedShown === key) return;
    state.wrappedShown = key; saveState();
    const s = wrappedStats(1); if(!s.count) return;
    popupBtns('Твой итог за '+s.month+' готов!','Посмотреть?',[{id:'go',type:'default',text:'Смотреть'},{id:'later',type:'default',text:'Позже'}], id => { if(id==='go') openWrapped(1); });
  }catch(e){}
}

/* ---------- DELEGATED CLICKS ---------- */
document.addEventListener('click', e => {
    const t = e.target.closest('[data-share],[data-freeze],[data-buypts],[data-buystar],[data-quests],[data-calendar],[data-warmup],[data-music],[data-tech],[data-water],[data-sleep],[data-calnav],[data-calday],[data-mplay],[data-mopen],[data-madd],[data-msearch],[data-plact],[data-pldel],[data-msr],[data-rsave],[data-wrapped],[data-wshare]');
  if(!t) return;
  haptic('light');
  const d = t.dataset;
  if('quests' in d) openQuests();
  else if('calendar' in d) openCalendar();
  else if('warmup' in d) openWarmup();
  else if('music' in d) openMusic();
  else if('mplay' in d) openMusic();
  else if('mopen' in d) openMusic();
  else if('madd' in d) addPlaylist();
  else if('msearch' in d) openLinkSafe('https://music.yandex.ru/search?text='+encodeURIComponent(d.msearch));
  else if('plact' in d){ state.user.activePlaylist = parseInt(d.plact); saveState(); renderProfile(); }
  else if('pldel' in d){ const i = parseInt(d.pldel); state.user.playlists.splice(i,1); if(state.user.activePlaylist>=state.user.playlists.length) state.user.activePlaylist = Math.max(0, state.user.playlists.length-1); saveState(); renderProfile(); }
  else if('tech' in d) openTech(d.tech);
    else if('water' in d) waterStep(parseFloat(d.water));
  else if('sleep' in d) setSleep(parseInt(d.sleep,10));
  else if('calnav' in d){ calOff = Math.min(0, calOff+parseInt(d.calnav,10)); renderCalendar(); }
  else if('calday' in d) openDay(d.calday);
  else if('msr' in d) saveMeasure();
  else if('rsave' in d) saveReminders();
  else if('wrapped' in d) openWrapped(0);
  else if('wshare' in d) openShareSheet('streak');
  else if('freeze' in d) useStreakFreeze();
  else if('share' in d){ if(d.share==='streak') shareStreakCard(); else shareProfileCard(); }
  else if('buypts' in d){ if((state.user.questPoints||0)<50) return; state.user.questPoints -= 50; state.user.streakFreezes++; saveState(); popup('Заморозка куплена! ❄️','Теперь у тебя '+plural(state.user.streakFreezes,['заморозка','заморозки','заморозок'])); refreshUI(); }
  else if('buystar' in d) buyWithStars(5,'Заморозка серии','1 заморозка для сохранения серии','streak_freeze',()=>{ state.user.streakFreezes++; saveState(); notify('success'); popup('Заморозка куплена! ❄️','Теперь у тебя '+plural(state.user.streakFreezes,['заморозка','заморозки','заморозок'])); refreshUI(); });
});

/* ---------- SHEET BEHAVIOUR ---------- */
(function(){
  const sh = $('sheet'), ov = $('overlay');
  function ensureClose(){
    if(sh.querySelector('.sheet-close')) return;
    const b = document.createElement('button'); b.className = 'sheet-close'; b.textContent = '✕'; b.setAttribute('aria-label','Закрыть');
    b.addEventListener('click', () => { haptic('light'); closeSheet(); });
    sh.insertBefore(b, sh.firstChild);
  }
  new MutationObserver(ensureClose).observe(sh, {childList:true});
  new MutationObserver(() => { if(sh.classList.contains('show')) ensureClose(); }).observe(sh, {attributes:true, attributeFilter:['class']});
  ov.addEventListener('click', () => { haptic('light'); closeSheet(); });
  let y0 = null;
  sh.addEventListener('touchstart', e => { y0 = (sh.scrollTop<=0 && !e.target.closest('#pList')) ? e.touches[0].clientY : null; }, {passive:true});
  sh.addEventListener('touchmove', e => { if(y0==null) return; const dy = e.touches[0].clientY-y0; if(dy>0){ sh.style.transition='none'; sh.style.transform='translateY('+dy+'px)'; } }, {passive:true});
  sh.addEventListener('touchend', e => { if(y0==null) return; const dy = e.changedTouches[0].clientY-y0; y0=null; sh.style.transition=''; sh.style.transform=''; if(dy>100){ haptic('light'); closeSheet(); } });
})();

/* ---------- NAV ---------- */
function switchTab(tab){
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  document.querySelectorAll('.dock-btn').forEach(b => b.classList.remove('active'));
  $('screen-'+tab).classList.remove('hidden');
  document.querySelector(`.dock-btn[data-tab="${tab}"]`).classList.add('active');
  if(tab==='home'){ renderHome(); if(tg && tg.BackButton) tg.BackButton.hide(); }
  if(tab==='stats'){ renderStats(); if(tg && tg.BackButton) tg.BackButton.show(); }
  if(tab==='programs'){ renderPrograms(); if(tg && tg.BackButton) tg.BackButton.show(); }
}
document.querySelectorAll('.dock-btn').forEach(b => { b.addEventListener('click', () => { haptic('light'); switchTab(b.dataset.tab); }); });
if(tg && tg.BackButton){ tg.BackButton.onClick(() => { haptic('light'); switchTab('home'); }); }

/* ---------- BOOT ---------- */
function boot(){
  initTheme();
  if(state.onboardingDone){ generateDailyQuests(); grantFreezeIfNeeded(); setTimeout(wrappedCheck, 2500); }
  if(!state.onboardingDone){
    $('onboarding').classList.remove('hidden');
    $('main').classList.add('hidden');
    obStep = 0; obChoice = {goal:null,level:null,program:null}; pfDraft = emptyProfile();
    renderOnboarding();
  } else {
    $('onboarding').classList.add('hidden');
    $('main').classList.remove('hidden');
    switchTab('home');
  }
}
boot();
</script>
